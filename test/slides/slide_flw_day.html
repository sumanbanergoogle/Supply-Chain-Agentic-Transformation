<!DOCTYPE html>
<html lang="en" class="theme-light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>05 · Frontline Worker (FLW): A Day in the Life across 5 Roles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Text:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../assets/aurora.css"><link rel="stylesheet" href="../assets/deck_nav.css?v=2">
<script src="../assets/deck_nav.js?v=17"></script>
<style>
  .flw-banner {
    margin-top: 16px; background: var(--surface); border: 1px solid var(--border-subtle);
    border-radius: 18px; padding: 10px; box-shadow: var(--shadow-sm);
  }
  .flw-banner img { width: 100%; height: 225px; object-fit: cover; border-radius: 12px; display: block; border: 1px solid var(--border-subtle); }

  .flw-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .flw-tab {
    display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--border-subtle); background: var(--surface); color: var(--text);
    font: 600 13px var(--font-display); cursor: pointer; transition: all .15s;
  }
  .flw-tab:hover { border-color: var(--g-blue); }
  .flw-tab.active { background: var(--g-blue); border-color: var(--g-blue); color: #FFF; }
  .flw-tab svg { width: 16px; height: 16px; }

  .flw-stage {
    margin-top: 12px; background: var(--surface); border: 1px solid var(--border-subtle);
    border-top: 4px solid var(--tc, var(--g-blue)); border-radius: 18px; padding: 18px 20px; box-shadow: var(--shadow-md);
  }
  .flw-top { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--border-subtle); }
  .flw-top h2 { margin: 2px 0 0; font: 600 20px var(--font-display); color: var(--text); }
  .flw-impact {
    padding: 8px 14px; border-radius: 12px; background: color-mix(in srgb, var(--g-green) 8%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--g-green) 35%, transparent); text-align: right;
  }
  .flw-impact b { display: block; font: 700 20px/1.1 var(--font-mono); color: var(--green-ink); }
  .flw-impact span { font: 500 11px var(--font-body); color: var(--text-muted); }

  .flw-cols { display: grid; grid-template-columns: 0.85fr 1.25fr 0.9fr; gap: 12px; margin-top: 14px; }
  .flw-box { padding: 13px 14px; border-radius: 14px; background: var(--surface-sunk); border: 1px solid var(--border-subtle); }
  .flw-box.pain { border-left: 4px solid var(--g-red); }
  .flw-box.life { border-left: 4px solid var(--g-blue); background: color-mix(in srgb, var(--g-blue) 5%, var(--surface)); }
  .flw-box.lang { border-left: 4px solid var(--g-green); }
  .flw-k { font: 700 10.5px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  .tl-grid { display: grid; gap: 7px; }
  .tl-chip {
    display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border-subtle); font: 600 12.5px var(--font-display); color: var(--text);
  }
  .tl-chip b { font: 700 11px var(--font-mono); color: var(--blue-ink); min-width: 58px; }
  .voice-q { padding: 9px 11px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border-subtle); font: 500 12.5px/1.35 var(--font-body); color: var(--text); }
  @media (max-width: 980px) { .flw-cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="mast">
  <a href="../index.html" style="display:flex;align-items:center;gap:12px;">
    <img src="../assets/media/wip/image25.png" alt="Google Cloud"><span class="mast-rule"></span>
    <span class="mast-tag">05 · Frontline Worker Day in the Life</span>
  </a>
  <span class="mast-sp"></span>
  <div class="mast-nav" id="mastSlideNav"><button class="btn-ghost" id="themeToggle" type="button">Dark</button></div>
</header>

<main class="page-wrap">
  <div class="page-kick"><i></i>Slide 05 · People First · Zero App Fatigue</div>
  <h1 class="page-h1">A Day in the Life: 5 Frontline Personas</h1>

  <div class="flw-banner">
    <img src="../assets/media/story/story_flw_day_in_life.jpg" alt="Sales Rep, Trade Merchandiser, Warehouse Picker, Line Operator, Field Agronomist">
  </div>

  <div class="flw-tabs">
    <button class="flw-tab active" onclick="showFlw('dsr', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l2-5h14l2 5M4 9v11h16V9"/></svg>1. Sales Rep (DSR)
    </button>
    <button class="flw-tab" onclick="showFlw('merch', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="4"/></svg>2. Merchandiser
    </button>
    <button class="flw-tab" onclick="showFlw('picker', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>3. Warehouse Picker
    </button>
    <button class="flw-tab" onclick="showFlw('line', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 20V9l6 4V9l6 4V4h8v16H2z"/></svg>4. Line Operator
    </button>
    <button class="flw-tab" onclick="showFlw('agro', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22V8M12 8C12 4 7 2 3 2c0 4 2 9 9 6zm0 0c0-4 5-6 9-6 0 4-2 9-9 6z"/></svg>5. Agronomist
    </button>
  </div>

  <section class="flw-stage" id="flwStage"></section>

  <footer class="deck-footer">
    <span>Slide 05 · Frontline Worker: A Day in the Life</span>
    <span class="footer-brand"><img src="../assets/media/wip/image25.png" alt="Google Cloud"><span style="width:1px;height:16px;background:#DADCE0;"></span><img src="../assets/media/gemini_enterprise_logo.svg" alt="Gemini Enterprise"></span>
  </footer>
</main>

<script>
  initDeckChrome({ root: '../' });
  var FLW = {
    dsr: {
      accent: 'var(--g-blue)',
      role: 'Beat Sales Representative (DSR)',
      setting: '38–45 Kirana Stores / Day · Android SFA',
      impact: '+18% LSPC',
      impactSub: 'Zero manual SFA punch-in',
      pain: '60+ cluttered Sales Force Automation (SFA) menus miss schemes & focus SKUs.',
      timeline: [
        ['08:30 AM', 'Voice Gate Huddle: top 4 at-risk kiranas'],
        ['11:15 AM', 'Store Nudge: Dark Fantasy ₹50 scheme prompt'],
        ['04:00 PM', 'Hinglish Voice Order → Draft SAP DMS']
      ],
      lang: 'Hindi / Hinglish Voice',
      quote: '"Gupta ji, Dark Fantasy ₹50 scheme active hai—4 box add karein?"',
      action: '✓ Drafted DMS Order #40892 (Wohlig API)'
    },
    merch: {
      accent: 'var(--g-purple)',
      role: 'Trade & Window-Display Merchandiser',
      setting: 'Modern Trade & Tier-1 Kirana Displays',
      impact: '21d → 2h',
      impactSub: 'Display payout turnaround',
      pain: 'Static Drive photos sit unverified for weeks causing claim disputes.',
      timeline: [
        ['09:30 AM', '1-Tap Shelf Photo: 62% Share-of-Shelf audit'],
        ['01:20 PM', 'Flag missing price strip & rival facings'],
        ['05:30 PM', 'Auto-release verified ₹1,200 display credit']
      ],
      lang: 'Multimodal Shelf Camera',
      quote: '"Rack 3 par Classmate & Bingo verify (62%). ₹1,200 credit queued."',
      action: '✓ Approved geo-tagged display claim'
    },
    picker: {
      accent: 'var(--g-yellow)',
      role: 'CFA Warehouse Picker & Dock Lead',
      setting: 'State CFA Morning Dispatch Waves',
      impact: '<0.5% Reject',
      impactSub: 'Protects 75% Q-Comm shelf-life',
      pain: 'Manual paper picklists send older batches to Blinkit/Zepto docks.',
      timeline: [
        ['05:45 AM', 'Lock ≥75% Minimum Remaining Shelf-Life (MRSL) wave'],
        ['07:10 AM', 'Co-load heavy Atta under light Biscuits'],
        ['09:00 AM', 'Print e-Way Bill & send 2-hr early ASN']
      ],
      lang: 'Kannada / Hindi Bay Voice',
      quote: '"Bay 4 se B-049 pick karo — Blinkit wave 82% shelf-life valid."',
      action: '✓ Locked FEFO batch & sent ASN'
    },
    line: {
      accent: 'var(--g-green)',
      role: 'ICML Factory Line & QA Operator',
      setting: 'Integrated Plant Packaging Lines',
      impact: '+4.2% OEE',
      impactSub: 'Faster changeover & seal quality',
      pain: 'Paper SOP manuals delay allergen washdowns & hide wrapper defects.',
      timeline: [
        ['06:00 AM', 'Optimal flavor run queue (min washdowns)'],
        ['12:40 PM', 'Vision alert on foil seal heat drift'],
        ['02:15 PM', 'Auto-tag lot genealogy before truck bay']
      ],
      lang: 'Bengali / Gujarati Line Voice',
      quote: '"Line 2 seal head +4°C high — adjust heater zone 2 now."',
      action: '✓ Logged SAP QM hold & adjusted run'
    },
    agro: {
      accent: '#0097A7',
      role: 'Field Agronomist (ITC MAARS)',
      setting: 'Village Wheat & Agri Sourcing Clusters',
      impact: '+11% Grade',
      impactSub: 'Vernacular farm advisory speed',
      pain: 'Leaf/soil photos wait days for lab grading & language translation.',
      timeline: [
        ['07:30 AM', 'Farmer snaps leaf photo → instant rust check'],
        ['11:00 AM', 'Standardize moisture & mandi grade intake'],
        ['04:45 PM', 'Broadcast voice spray alert to 120 farms']
      ],
      lang: 'Hindi / Punjabi Agri Voice',
      quote: '"Gehun mein yellow rust ke sanket hain — 48h mein spray karein."',
      action: '✓ Sent MAARS voice advisory + ETA'
    }
  };

  window.showFlw = function (key, btn) {
    document.querySelectorAll('.flw-tab').forEach(function (b) { b.classList.remove('active'); });
    if (btn) btn.classList.add('active');
    var d = FLW[key];
    var st = document.getElementById('flwStage');
    st.style.setProperty('--tc', d.accent);
    st.innerHTML =
      '<div class="flw-top">' +
        '<div><div style="font:700 10.5px var(--font-mono);color:var(--blue-ink);text-transform:uppercase;">' + d.setting + '</div><h2>' + d.role + '</h2></div>' +
        '<div class="flw-impact"><b>' + d.impact + '</b><span>' + d.impactSub + '</span></div>' +
      '</div>' +
      '<div class="flw-cols">' +
        '<div class="flw-box pain"><div class="flw-k" style="color:var(--red-ink);">Legacy App Pain</div><div style="font:600 13.5px/1.4 var(--font-display);color:var(--text);">' + d.pain + '</div></div>' +
        '<div class="flw-box life"><div class="flw-k" style="color:var(--blue-ink);">Shift Flow with AI</div><div class="tl-grid">' + d.timeline.map(function (t) {
          return '<div class="tl-chip"><b>' + t[0] + '</b><span>' + t[1] + '</span></div>';
        }).join('') + '</div></div>' +
        '<div class="flw-box lang"><div class="flw-k" style="color:var(--green-ink);">' + d.lang + '</div><div class="voice-q">' + d.quote + '</div><div style="margin-top:8px;font:700 11.5px var(--font-mono);color:var(--green-ink);">' + d.action + '</div></div>' +
      '</div>';
  };
  showFlw('dsr');
</script>
</body></html>
