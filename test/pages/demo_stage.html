<!DOCTYPE html>
<html lang="en" class="theme-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>06 · Live Demo Stage — Agentic Supply Chain Transformation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Text:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../assets/aurora.css">
<link rel="stylesheet" href="../assets/deck_nav.css?v=2">
<script src="../assets/deck_nav.js?v=15"></script>
<script src="../data/live_agents_registry.js?v=1"></script>
<style>
  .demo-wrap { max-width: 1400px; margin: 0 auto; padding: 26px max(24px, 4vw) 72px; }
  .head-bar { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .headline { font: 700 clamp(26px, 2.7vw, 38px)/1.12 var(--font-display); letter-spacing: -0.8px; margin: 4px 0 6px; color: var(--text); }
  .sub { margin: 0; font: 400 14.5px/1.45 var(--font-body); color: var(--text-muted); max-width: 72ch; }
  .demo-select {
    padding: 9px 14px; border-radius: 10px; border: 1px solid var(--border-strong);
    background: var(--surface); color: var(--text); font: 600 13px var(--font-display); max-width: 380px;
  }
  .stage-grid { display: grid; grid-template-columns: 1.45fr 0.65fr; gap: 20px; align-items: stretch; }
  @media (max-width: 960px) { .stage-grid { grid-template-columns: 1fr; } }
  .video-card {
    background: var(--surface); border: 1px solid var(--border-subtle); border-radius: 16px;
    padding: 14px; box-shadow: var(--shadow-md); display: flex; flex-direction: column; gap: 12px;
  }
  .video-frame {
    position: relative; border-radius: 12px; overflow: hidden; background: #0d111a;
    height: clamp(260px, 46vh, 430px); border: 1px solid var(--border-subtle);
  }
  .video-frame video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .upload-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    padding: 9px 13px; border-radius: 10px; background: var(--surface-sunk); border: 1px dashed var(--border-strong);
  }
  .up-label {
    display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px; border-radius: 999px;
    background: var(--g-blue); color: #fff; font: 600 12px var(--font-display); cursor: pointer;
  }
  .up-reset {
    padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border-strong);
    background: var(--surface); color: var(--text-muted); font: 600 11.5px var(--font-display); cursor: pointer;
  }
  .launch-panel {
    background: var(--surface); border: 1px solid var(--border-subtle); border-radius: 16px;
    padding: 18px; box-shadow: var(--shadow-md); display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
  }
  .gemini-btn {
    background: var(--gemini-spark); color: #FFF; font: 700 14.5px var(--font-display);
    padding: 12px 18px; border-radius: 999px; text-decoration: none;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: var(--shadow-md); transition: transform .15s, filter .15s;
  }
  .gemini-btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
  .t-row {
    padding: 8px 11px; border-radius: 9px; background: var(--surface-sunk); border: 1px solid var(--border-subtle);
    display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px;
  }
  .t-row span:first-child { color: var(--text-muted); font: 700 10.5px var(--font-mono); text-transform: uppercase; }
  .t-row b { font: 600 12px var(--font-display); color: var(--text); text-align: right; }
  .prompt-chip {
    display: block; width: 100%; text-align: left; padding: 7px 10px; border-radius: 8px;
    border: 1px solid var(--border-subtle); background: var(--surface); color: var(--text);
    font: 400 12px/1.38 var(--font-body); cursor: pointer; margin-top: 6px; transition: border-color .15s;
  }
  .prompt-chip:hover { border-color: var(--g-blue); }
</style>
</head>
<body>

<header class="mast">
  <a href="../index.html" style="display:flex;align-items:center;gap:12px;">
    <img src="../assets/media/wip/image25.png" alt="Google Cloud">
    <span class="mast-rule"></span>
    <span class="mast-tag">06 · Live Demo Stage</span>
  </a>
  <span class="mast-sp"></span>
  <div class="mast-nav" id="mastSlideNav">
    <button class="btn-ghost" id="themeToggle" type="button">Dark</button>
  </div>
</header>

<main class="demo-wrap">
  <div class="head-bar">
    <div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;">
        <span style="width:22px;height:3px;border-radius:2px;background:var(--gemini-spark);"></span>
        <span style="font:700 11.5px var(--font-mono);color:var(--green-ink);letter-spacing:1.2px;text-transform:uppercase;" id="stageKicker">LIVE IN GEMINI ENTERPRISE</span>
      </div>
      <h1 class="headline" id="agentTitle">Load Consolidation Agent (ITC TMD)</h1>
      <p class="sub" id="agentDesc"></p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <select class="demo-select" id="agentQuickSel" aria-label="Choose Live Agent Demo"></select>
    </div>
  </div>

  <div class="stage-grid">
    <div class="video-card">
      <div class="video-frame">
        <video id="demoPlayer" controls playsinline preload="metadata"></video>
      </div>
      <div class="upload-bar">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <label class="up-label">
            <span>&#128228; Upload Demo Video (.mp4 / .webm)</span>
            <input type="file" id="videoUpload" accept="video/*" hidden>
          </label>
          <button type="button" class="up-reset" id="resetVideoBtn" hidden>Revert Built-In Video</button>
        </div>
        <span style="font:600 11.5px var(--font-mono);color:var(--text-muted)" id="videoStatus">Loading bundled recording...</span>
      </div>
    </div>

    <aside class="launch-panel">
      <div>
        <div style="font:700 11px var(--font-mono);color:var(--green-ink);margin-bottom:7px;">&#9679; DIRECT GEMINI ENTERPRISE LINK</div>
        <a class="gemini-btn" id="launchGeBtn" target="_blank" rel="noopener noreferrer" href="#">
          <img src="../assets/media/gemini_enterprise_logo.svg" alt="" style="width:18px;height:18px;filter:brightness(0) invert(1);">
          <span>Launch Live Demo &#8599;</span>
        </a>
      </div>
      <div style="display:grid;gap:7px;" id="telemList"></div>
      <div style="background:var(--surface-sunk);border-radius:10px;padding:11px 12px;border:1px solid var(--border-subtle);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;">
          <span style="font:700 10.5px var(--font-mono);color:var(--blue-ink);">TRY THESE PROMPTS LIVE (CLICK TO COPY)</span>
          <span id="copyToast" style="font:600 10.5px var(--font-mono);color:var(--green-ink);display:none;">Copied!</span>
        </div>
        <div id="starterPromptList"></div>
      </div>
    </aside>
  </div>
</main>

<script>
  initDeckChrome({ root: '../', prev: '../slides/slide_03.html', next: '../slides/slide_04.html' });

  (function () {
    var liveAgents = window.SC_LIVE_AGENTS || [];
    if (!liveAgents.length) return;
    var qs = new URLSearchParams(location.search);
    var reqId = qs.get('agent') || liveAgents[0].id;
    var ag = liveAgents.find(function (a) { return a.id === reqId || a.name.toLowerCase() === reqId.toLowerCase(); }) || liveAgents[0];

    var DB_NAME = 'sc_demo_stage_videos_v1';
    function openDb() {
      return new Promise(function (resolve, reject) {
        if (!window.indexedDB) return reject(new Error('IndexedDB unavailable'));
        var req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = function (e) { e.target.result.createObjectStore('videos'); };
        req.onsuccess = function (e) { resolve(e.target.result); };
        req.onerror = function (e) { reject(e.target.error); };
      });
    }
    function getSavedVideo(k) {
      return openDb().then(function (db) {
        return new Promise(function (resolve) {
          var tx = db.transaction('videos', 'readonly').objectStore('videos').get(k);
          tx.onsuccess = function () { resolve(tx.result || null); };
          tx.onerror = function () { resolve(null); };
        });
      }).catch(function () { return null; });
    }
    function saveVideo(k, rec) {
      return openDb().then(function (db) {
        return new Promise(function (resolve, reject) {
          var tx = db.transaction('videos', 'readwrite');
          tx.objectStore('videos').put(rec, k);
          tx.oncomplete = resolve; tx.onerror = reject;
        });
      });
    }
    function deleteSavedVideo(k) {
      return openDb().then(function (db) {
        return new Promise(function (resolve) {
          var tx = db.transaction('videos', 'readwrite');
          tx.objectStore('videos').delete(k);
          tx.oncomplete = resolve;
        });
      });
    }

    var aSel = document.getElementById('agentQuickSel');
    aSel.innerHTML = liveAgents.map(function (a) {
      var lbl = a.isItcTmd ? (a.geDisplayName + ' · ' + a.persona) : (a.name + ' (' + a.pillar + ')');
      return '<option value="' + a.id + '"' + (a.id === ag.id ? ' selected' : '') + '>' + lbl + '</option>';
    }).join('');
    aSel.addEventListener('change', function () { location.search = '?agent=' + encodeURIComponent(aSel.value); });

    document.getElementById('stageKicker').textContent = 'LIVE IN GEMINI ENTERPRISE · ' + (ag.pillar || 'SUPPLY CHAIN').toUpperCase();
    document.getElementById('agentTitle').textContent = ag.geDisplayName || ag.name;
    document.getElementById('agentDesc').textContent = ag.outcome || '';
    document.getElementById('launchGeBtn').href = ag.geUrl || 'https://vertexaisearch.cloud.google.com/';

    document.getElementById('telemList').innerHTML = [
      ['Persona Owner', ag.persona || 'Supply Chain Lead'],
      ['Build Mode', ag.buildMode || 'Low-Code Agent Studio'],
      ['Model (Global)', ag.model || 'gemini-3.1-pro-preview'],
      ['Human Gate', '1-Click Sign-Off · ERP Untouched']
    ].map(function (r) { return '<div class="t-row"><span>' + r[0] + '</span><b>' + r[1] + '</b></div>'; }).join('');

    var prompts = (ag.starterPrompts && ag.starterPrompts.length) ? ag.starterPrompts : (ag.samplePrompt ? [ag.samplePrompt] : []);
    var pList = document.getElementById('starterPromptList');
    pList.innerHTML = prompts.map(function (p, idx) {
      return '<button type="button" class="prompt-chip" data-idx="' + idx + '">"' + p + '"</button>';
    }).join('');
    pList.querySelectorAll('.prompt-chip').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var txt = prompts[Number(btn.dataset.idx)] || '';
        if (navigator.clipboard && txt) navigator.clipboard.writeText(txt);
        var toast = document.getElementById('copyToast');
        toast.style.display = 'inline';
        setTimeout(function () { toast.style.display = 'none'; }, 1400);
      });
    });

    var player = document.getElementById('demoPlayer');
    var statusEl = document.getElementById('videoStatus');
    var resetBtn = document.getElementById('resetVideoBtn');
    var activeBlobUrl = null;
    function loadVideo() {
      if (activeBlobUrl) { URL.revokeObjectURL(activeBlobUrl); activeBlobUrl = null; }
      getSavedVideo(ag.id).then(function (rec) {
        if (rec && rec.blob) {
          activeBlobUrl = URL.createObjectURL(rec.blob);
          player.src = activeBlobUrl;
          statusEl.textContent = 'Custom video: ' + rec.name + ' (' + (rec.blob.size / 1e6).toFixed(1) + ' MB)';
          resetBtn.hidden = false;
        } else {
          var vpath = ag.videoSrc || 'assets/media/video/demand_sensing_demo.mp4';
          player.src = '../' + vpath;
          statusEl.textContent = 'Bundled: ' + vpath.split('/').pop();
          resetBtn.hidden = true;
        }
      });
    }
    loadVideo();
    document.getElementById('videoUpload').addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      saveVideo(ag.id, { name: file.name, type: file.type, blob: file }).then(loadVideo);
    });
    resetBtn.addEventListener('click', function () { deleteSavedVideo(ag.id).then(loadVideo); });
  })();
</script>
</body>
</html>
